# ====================================
# SERVER CONFIGURATION
# ====================================
server.port=8081
server.servlet.context-path=/

# ====================================
# MYSQL DATABASE CONFIGURATION
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/lakgamana?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Denji@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# JPA/HIBERNATE CONFIGURATION
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================
# FLYWAY DATABASE MIGRATION
# ====================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ====================================
# JWT CONFIGURATION
# ====================================
jwt.secret=lakgamana-super-secret-key-for-jwt-token-generation-2024-this-is-a-very-long-secret-key-that-meets-hs512-requirements-minimum-512-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ====================================
# CORS CONFIGURATION
# ====================================
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================================
# LOGGING CONFIGURATION
# ====================================
logging.level.com.lakgamana=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ====================================
# SPRING DOC OPENAPI CONFIGURATION
# ====================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ====================================
# APPLICATION CONFIGURATION
# ====================================
spring.application.name=lakgamana-backend
spring.profiles.active=dev
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ====================================
# VALIDATION CONFIGURATION
# ====================================
spring.jpa.properties.hibernate.validator.fail_fast=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ====================================
# FILE UPLOAD CONFIGURATION
# ====================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# EMAIL CONFIGURATION (Optional)
# ====================================
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ====================================
# CACHE CONFIGURATION (Optional)
# ====================================
# spring.cache.type=simple
# spring.cache.cache-names=trains,users,bookings

# ====================================
# SECURITY CONFIGURATION
# ====================================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ====================================
# ACTUATOR CONFIGURATION
# ====================================
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ====================================
# ERROR HANDLING
# ====================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
